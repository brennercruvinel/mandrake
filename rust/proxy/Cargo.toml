[package]
name = "mandrake-proxy"
description = "Local proxy between Claude Code and the API: trims the request, measures before and after"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mandrake-home.workspace = true
mandrake-meter.workspace = true
anyhow.workspace = true
serde.workspace = true
# preserve_order: the trimmed body keeps the original key order, so the prompt cache prefix stays stable
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
