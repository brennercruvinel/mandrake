# Every entry of the Claude Code folder (~/.claude) that `mandrake setup` can arrange.
# group: config (what shapes the agent), plugins, session (history and runtime the CLI writes).
# sensitive: holds conversations, prompts or pasted content; the wizard says so before linking it.
# A profile may name other paths too (agents/<name>.md); these are the ones the wizard walks.

[[item]]
path = "CLAUDE.md"
kind = "file"
group = "config"
about = "Instruções lidas no começo de cada sessão"

[[item]]
path = "settings.json"
kind = "file"
group = "config"
about = "Configuração global; o Mandrake só acrescenta a pasta do prompt-trim em CLAUDE_CODE_PLUGIN_DIRS"

[[item]]
path = "statusline.sh"
kind = "file"
group = "config"
about = "Comando da linha de status"

[[item]]
path = "agents"
kind = "dir"
group = "config"
about = "Definições de subagentes"

[[item]]
path = "commands"
kind = "dir"
group = "config"
about = "Comandos de barra (/comando)"

[[item]]
path = "skills"
kind = "dir"
group = "config"
about = "Skills do usuário"

[[item]]
path = "hooks"
kind = "dir"
group = "config"
about = "Scripts de hook"

[[item]]
