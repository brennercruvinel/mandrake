# Every entry of the Claude Code folder (~/.claude) that `mandrake setup` can arrange.
# group: config (what shapes the agent), plugins, session (history and runtime the CLI writes).
# sensitive: holds conversations, prompts or pasted content; the wizard says so before linking it.
# A profile may name other paths too (agents/<name>.md); these are the ones the wizard walks.

[[item]]
path = "CLAUDE.md"
kind = "file"
group = "config"
about = "Instructions read at the start of every session"

[[item]]
path = "settings.json"
kind = "file"
group = "config"
about = "Global settings; Mandrake only writes ANTHROPIC_BASE_URL and CLAUDE_CODE_PLUGIN_DIRS in it"

[[item]]
path = "statusline.sh"
kind = "file"
group = "config"
about = "Status line command"

[[item]]
path = "agents"
kind = "dir"
group = "config"
about = "Subagent definitions"

[[item]]
