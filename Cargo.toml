[workspace]
resolver = "3"
members = ["rust/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/brennercruvinel/mandrake"

[workspace.dependencies]
mandrake-home = { path = "rust/home" }
mandrake-layout = { path = "rust/layout" }
mandrake-meter = { path = "rust/meter" }
mandrake-proxy = { path = "rust/proxy" }
mandrake-tui = { path = "rust/tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
