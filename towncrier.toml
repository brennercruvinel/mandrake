# The changelog's unreleased entries: one file per change in docs/news/, named <issue>.<type>.md
# (+<name>.<type>.md for a change with no issue), so no two pull requests edit the same line of
# docs/CHANGELOG. `towncrier build --version X.Y.Z` writes them as the release's section below the
# marker and removes them. Types and format follow urna (ADR-0001).
[tool.towncrier]
directory = "docs/news"
filename = "docs/CHANGELOG"
start_string = "<!-- towncrier: each release lands below this line -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
template = "towncrier:default.md"
wrap = false
all_bullets = true
orphan_prefix = "+"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
