# cargo-deny policy: known advisories, licenses and where crates come from.
# Run `cargo deny check`; the gate runs it on every pull request.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in the lock blocks, like an advisory.
yanked = "deny"
ignore = []

[licenses]
# The licenses present in Cargo.lock. A crate under anything else, copyleft-only included, fails
# the check on purpose: adding it is a decision for the pull request that brings it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
# Two versions of one crate grow the binary and the audit surface; a warning makes the lock
# update that fixes it visible without blocking a pull request.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
