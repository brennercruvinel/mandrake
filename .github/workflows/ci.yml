# The same gate as tool/fullcheck.sh, on Linux and macOS, against the Claude Code versions Mandrake
# supports (docs/guide/setup.md, "Claude Code versions"). No secret is used; anina is private, so
# the tapes are skipped here and recorded locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullcheck:
    name: fullcheck (${{ matrix.os }}, Claude Code ${{ matrix.claude }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # The newest Claude Code is a warning, not a failure: a new release can move the plugin API
    # under prompt-trim before anyone had the chance to look.
    continue-on-error: ${{ matrix.claude == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        claude: ["2.1.287", "2.1.310", latest]
        include:
          # macOS minutes cost ten times more: the newest checked version only.
          - os: macos-15
            claude: "2.1.310"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,shellcheck,zizmor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Claude Code ${{ matrix.claude }}
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
        # The version under test is the point of the step, so it is not in a lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION"
          claude --version
      - name: tool/fullcheck.sh
        env:
          FULLCHECK_BASE: origin/${{ github.base_ref || 'main' }}
          FULLCHECK_SKIP_NEWS: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'skip-news')) && '1' || '0' }}
        run: tool/fullcheck.sh
